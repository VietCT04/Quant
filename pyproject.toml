[project]
name = "quant-marketdata"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiohttp>=3.13,<4",
    "duckdb>=1.4,<2",
    "numpy>=2.2,<3",
    "polars>=1.32,<2",
    "psutil>=7,<8",
    "pyarrow>=21,<26",
    "rich>=14,<16",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
